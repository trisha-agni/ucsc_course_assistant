[project]
name = "ucsc-course-assistant"
version = "0.1.0"
description = "UCSC course assistant"
requires-python = ">=3.14"
dependencies = [
	"beautifulsoup4",
	"flake8",
	"langchain-core",
	"langchain-openrouter",
	"langgraph",
	"ollama",
	"openai",
	"python-dotenv",
	"requests",
	"sentence-transformers",
	"streamlit",
	"torch",
]

[tool.flake8]
max-line-length = 89
